name: CI checks

on: [ push, pull_request ]

jobs:
  build:

    runs-on: ubuntu-latest

    name: Compilation

    steps:
    - name: Install dependencies
      run: sudo apt-get install -y flex bison gawk tcl tcl-dev tk tk-dev libcairo2 libcairo2-dev xcb libxcb1 libxcb1-dev libxrender-dev libxpm-dev libxcb-render0-dev libx11-xcb1 libx11-xcb-dev xvfb
    - name: Checkout source
      uses: actions/checkout@v4
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: Archive compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: xschem
        path: src/xschem
    # Hard gate: the true-headless tests (no X). test_sweep_diff round-trips every
    # cell in tests/test_sweep_diff/; a load/save regression or parser crash fails CI.
    #
    # Issue 0351: this gate used to be exactly test_sweep_diff + test_nogui, so not
    # one suite the 2026-08 gesture work produced could fail CI -- they existed only
    # in the informational audit at the bottom of this file. Every suite listed here
    # is measured to pass with DISPLAY unset (9 of them are not even in full_audit's
    # nogui_tests list -- they pass in the plain --pipe -q --nolog arm), so they
    # belong in this cheap deterministic step and not behind xvfb. The tenth,
    # test_placement_wire_gate, joined nogui_tests in issue 0355: DISPLAY is unset in
    # this step so it was always safe here, but it hangs forever under the xvfb audit
    # below and for anyone running it by hand.
    #
    # AUDIT_MIN_PASS is the EXACT count of listed suites, not a slack floor like the
    # xvfb gate's 15-of-33: none of these may legitimately skip, so a skip IS the
    # regression. That floor is what repairs "a SKIP can never fail the audit"
    # (issue 0350). The floor counts PASSes, so it is only as honest as full_audit's
    # is_pass: that predicate used to be an unanchored substring test, and a suite
    # that printed FAIL lines and exited 1 was scored PASS -- and counted toward this
    # floor -- if ANY line of its output merely contained "OVERALL: ok" (measured,
    # issue 0354). Every classifier predicate is now line-anchored, so a banner
    # counts only at COLUMN 0 -- which narrows that hole but does not close it:
    # is_pass still consults neither has_failure nor the exit code, so a column-0
    # pass banner next to real column-0 FAIL lines would still count here. No suite
    # emits that shape today (measured across 296); see 0354 "still open" item 1.
    # A renamed or deleted test is caught separately by full_audit's
    # `MISSING | <name>` -> FAIL arm, so this explicit list cannot silently shrink.
    # Keep the list and the floor in sync with $GATED in
    # tests/headless/test_audit_classifier.tcl, which asserts both.
    - name: Headless gate
      run: |
        set -euo pipefail
        AUDIT_MIN_PASS=15 tests/headless/full_audit.sh \
          test_sweep_diff test_nogui \
          test_shape_draw_gate test_paste_modify_flag_0244 test_add_wire_label \
          test_placement_wire_gate test_label_ride test_placement_preview_doors \
          test_label_strand_oracle test_sch_add_pin test_wire_split \
          test_crossview_paste test_instance_update \
          test_audit_classifier test_descend_inert_class
    # Hard gate: the committed netlist goldens (tests/headless/run.sh, 6 cases).
    # It was in no CI step at all before issue 0351.
    - name: Netlist golden gate
      run: tests/headless/run.sh
    # Hard gate: the fluid-editing suites under a virtual X (hardening plan A5) --
    # the 52-test wireedit scripted suite plus every fluid / rotate-stretch /
    # cadence-gesture test (globbed, so new fluid tests are gated automatically).
    # These are deterministic on GH runners (watched over 5 informational runs);
    # the environment-sensitive GUI/libmgr cases (19 deterministic failures on GH
    # runners as of 2026-07-11, test_cadence_drag among them) stay in the
    # informational full audit below.
    # AUDIT_MIN_PASS: fail on hollow green (all-skip under a broken xvfb). The gate list is
    # built via an ASSIGNMENT so a renamed/deleted gated test fails the ls under bash -e
    # instead of silently shrinking the gate (both from review wf_bfc3c5e4).
    - name: Fluid suites gate (xvfb)
      run: |
        set -euo pipefail
        cd tests/headless
        gate_tests=$(ls test_fluid_*.tcl test_rotate_*.tcl test_cadence_stretch_move.tcl test_drag_keeps_selection.tcl | sed 's/\.tcl$//')
        AUDIT_MIN_PASS=15 xvfb-run -a ./full_audit.sh wireedit $gate_tests
    # Informational: the whole tests/headless/ suite under a virtual X. Non-blocking
    # (|| true) because several GUI/library-migration cases are environment-sensitive
    # (deterministically red on GH runners); the log is uploaded so results are
    # visible without flaking the build. The fluid suites above are the hard gate.
    - name: Full headless audit (informational)
      run: |
        xvfb-run -a tests/headless/full_audit.sh > full_audit.log 2>&1 || true
        grep -E '^(PASS|FAIL|SKIP|CRASH|TIMEOUT) ' full_audit.log || true
        grep -E '^SUMMARY' full_audit.log || true
    - name: Archive headless audit log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: headless-audit-log
        path: full_audit.log
